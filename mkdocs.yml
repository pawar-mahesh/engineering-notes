site_name: Engineering Notes
site_description: Practical, interconnected notes for engineering foundations.
site_url: https://pawar-mahesh.github.io/engineering-notes/
docs_dir: .mkdocs-docs
copyright: Copyright &copy; 2026 Mahesh Pawar

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-6
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-6
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: README.md
  - Fundamentals:
      - Networking:
          - IP Addresses and Ports: fundamentals/networking/ip-addresses-and-ports.md
          - TCP: fundamentals/networking/tcp.md
          - UDP: fundamentals/networking/udp.md
          - Network Sockets: fundamentals/networking/sockets.md
          - DNS: fundamentals/networking/dns.md
          - HTTP: fundamentals/networking/http.md
          - TLS: fundamentals/networking/tls.md
          - TLS Certificates: fundamentals/networking/certificates.md
          - HTTPS: fundamentals/networking/https.md
